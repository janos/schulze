name: Go
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet -v ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" ./...

      - name: Test
        run: go test -v -race ./...
